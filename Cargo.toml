[workspace]
resolver = "3"
members = [
    "crates/fxsound-core",
    "crates/fxsound-dsp",
    "crates/fxsound-rnnoise",
    "crates/fxsound-preset",
    "crates/fxsound-audio",
    "crates/fxsound-ui",
    "crates/fxsound-app",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.100.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/blackixxce12/CrossFX"

[workspace.dependencies]
fxsound-core = { path = "crates/fxsound-core" }
fxsound-dsp = { path = "crates/fxsound-dsp" }
# RNNoise, as a pure-Rust port: `nnnoiseless` 0.5.2, vendored into the tree rather than taken from
# the registry. Three things the denoiser needs are not in the published crate's API — the
# twenty-two band gains (a linked-stereo mask is built from them), an in-place `reset()` (the
# registry crate can only be rebuilt, which is an allocation on the audio thread), and a
# synthesis path without the network (the per-channel half of linked stereo). BSD-3-Clause, which
# an AGPL-3.0 work may incorporate; its `COPYING` travels with it, and the model weights are
# embedded in the crate rather than loaded from a file.
fxsound-rnnoise = { path = "crates/fxsound-rnnoise" }
fxsound-preset = { path = "crates/fxsound-preset" }
fxsound-audio = { path = "crates/fxsound-audio" }
fxsound-ui = { path = "crates/fxsound-ui" }

egui = "=0.37.0"
# `wayland` and `x11` are winit's Linux backends and do nothing on Windows, where winit always
# drives a Win32 window; `glow` is OpenGL on both.
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

pipewire = "0.10.1"
libspa = "0.10.1"
# The raw bindings `pipewire` is built on, at the version it pins. Only `fxsound-audio`'s `aec`
# module uses them, for the one call the safe crate does not wrap (`pw_context_load_module`).
pipewire-sys = "0.10.1"

resvg = "0.50.0"
usvg = "0.50.0"
tiny-skia = "0.12.0"
# The name table and the character map of a font the user hands CrossFX: whether a file is a
# Gilroy, which of its faces, and whether it has the letters of the language in force
# (`fxsound-ui/src/typeface.rs`). Not the newest skrifa but the one egui parses fonts with
# (epaint's own dependency, its features a subset of epaint's): a file read here is then a file
# egui loads, where a file egui could not parse would be a panic at every start. A test in
# `typeface` fails when egui moves to another.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }

ksni = "0.3.7"
notify-rust = "4.19.0"
rfd = "0.18.0"
# `ksni` is not runtime-agnostic: its `default = ["tokio"]` feature is a hard requirement
# (`ksni-0.3.6/src/compat.rs:1-5` is a `compile_error!` when neither runtime is on), and its
# `blocking` facade — the one CrossFX uses, so that the tray handle can be driven straight from
# the egui thread — builds a private current-thread runtime on top of it
# (`ksni-0.3.6/src/compat.rs:24-35`). Pin the flavour here instead of inheriting whatever ksni's
# own transitive `features = ["rt", "macros"]` happens to resolve to.
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }
# The zbus the D-Bus service, the desktop notifications and the suspend watcher speak through: the
# major version notify-rust 4.19 is built on, which `crates/fxsound-app/src/notify.rs` relies on to
# send notify-rust's own encoding of its hints. ksni 0.3.7 keeps zbus 5 to itself, and no type
# crosses between the two. The features are the app's to choose (`crates/fxsound-app/Cargo.toml`).
zbus = { version = "6.3.0", default-features = false }

crossbeam-channel = "0.5.17"
# A Wayland client gets no close request from `kill`, `systemctl --user stop` or a logout hook;
# the flag this registers is what turns those into the same clean quit as the tray's Exit.
signal-hook = "0.4.6"
triple_buffer = "9.0.1"
arc-swap = "1.9.5"
realfft = "3.5.1"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
dirs = "7.0.0"
thiserror = "2.0.21"
log = "0.4.35"
# The local time a deleted preset's `.trashinfo` records (the FreeDesktop.org Trash specification
# asks for local time). Already in the tree through env_logger; `tz-system` and `tzdb-zoneinfo`
# read the system's zone from `/etc/localtime` and `/usr/share/zoneinfo` and bring no crate in.
jiff = { version = "0.2.43", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
env_logger = "0.11.11"
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"

# Windows only. The Recycle Bin a deleted preset goes to (`fxsound-preset`'s `trash`).
trash = { version = "5.3.0", default-features = false, features = ["coinit_apartmentthreaded"] }
# Windows only. Microsoft's bindings: WASAPI, the MMDevice API and the endpoint policy in
# `fxsound-audio`, the control pipe, the registry and the shell in `fxsound-app`. No features here:
# each crate names the API families it uses, so that its build compiles only those.
windows = "0.62.2"
windows-core = "0.62.2"
# Windows only. The notification-area icon and its menu, in place of the StatusNotifierItem tray.
tray-icon = { version = "0.26.1", default-features = false }
# Windows only, a build-dependency of fxsound-app: compiles crossfx.exe's icon, version
# information and manifest with the SDK's rc.exe (crates/fxsound-app/build.rs). Without its
# default `toml` feature, which reads the strings from [package.metadata]: build.rs sets them.
winresource = { version = "0.1.34", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
