<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><!-- Tray status icon 'on', power on with nothing playing (the state of the original's IDI_LOGO_WHITE): the wave-X of CrossFX's icon (assets/icons/apps/crossfx.svg) without its tile, on a transparent background, in #ffffff. Installed as hicolor/scalable/status/io.github.blackixxce12.CrossFX-on.svg for StatusNotifier hosts that look the icon up by name; the binary embeds the same file and rasterises it at start-up for hosts that do not, and for the Windows notification area, which on a light taskbar gets it in near-black (crates/crossfx-app/src/tray.rs, src/win/tray.rs). --><path d="M44 44 L212 212 M44 212 C100.3 212.3 128.3 184.3 128 128 C127.7 71.7 155.7 43.7 212 44" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/></svg>
