[package]
name = "fxsound-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop integration for the FxSound Linux port: command line, single-instance IPC, StatusNotifierItem tray and desktop notifications"

[lib]
name = "fxsound_app"
path = "src/lib.rs"

[[bin]]
name = "fxsound"
path = "src/main.rs"

[dependencies]
fxsound-core = { workspace = true }
fxsound-ui = { workspace = true }
fxsound-dsp = { workspace = true }
fxsound-preset = { workspace = true }
fxsound-audio = { workspace = true }
eframe = { workspace = true }
rfd = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true }
crossbeam-channel = { workspace = true }
signal-hook = { workspace = true }
# `blocking` is additive on top of the workspace's default (`tokio`) feature and gives us
# `ksni::blocking::Handle::update`, which is synchronous — the egui thread must never await
# (`docs/api/linux-desktop-crates.md` §2.9).
ksni = { workspace = true, features = ["blocking"] }
notify-rust = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `--self-test` parses the settings file itself: `Settings::load` moves a file it cannot parse
# aside, and a self-test must not write anything.
toml = { workspace = true }
dirs = { workspace = true }
log = { workspace = true }
# A runtime per job, never a shared one: ksni's tray service runs on a private current-thread
# runtime of its own (`docs/api/linux-desktop-crates.md` §1), and the D-Bus service
# (`src/dbus.rs`), the suspend watcher (`src/sleep.rs`) and the notifications' kept connection
# (`src/notify.rs`) each build another. `net` and `time` are those runtimes' drivers — zbus
# registers its socket with the reactor, and a method call waits for the GUI thread under a
# timeout — and `sync` is the oneshot the answer comes back on. zbus asks for all three itself;
# naming them here keeps the build from depending on that.
tokio = { workspace = true, features = ["net", "sync", "time"] }
# The D-Bus service, the notifications and the suspend watcher. zbus 6 has no blocking API: every
# connection here is async and is built inside one of the runtimes above, which `tokio` puts it
# on; `service` is the object server the service is served by. notify-rust brings `proxy` and
# `default-rt` along; the program relies on neither, and the tests name `proxy` themselves.
zbus = { workspace = true, features = ["tokio", "service"] }
# The tray's status icons, rasterised once at start-up for hosts that do not look them up by name
# in the icon theme (0.4.0 design §11). The same three the UI crate draws its artwork with.
resvg = { workspace = true }
usvg = { workspace = true }
tiny-skia = { workspace = true }

[dev-dependencies]
# The tests' scratch directories and guarded children (`fxsound_core::test_support`).
fxsound-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
# The tests call the service, and ask the bus who owns a name, through proxies.
zbus = { workspace = true, features = ["proxy"] }
