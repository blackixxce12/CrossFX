[package]
name = "fxsound-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Audio backends for CrossFX: PipeWire on Linux, WASAPI on Windows — the virtual device, the DSP and the playback stream"

[dependencies]
fxsound-core = { workspace = true }
fxsound-dsp = { workspace = true }
crossbeam-channel = { workspace = true }
triple_buffer = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
# The handover's journal, `$XDG_STATE_HOME/crossfx/handover.toml` (`src/stream_handover.rs`): the
# volumes of the streams a handover has faded and not given back yet, in the format and with the
# crates the settings file is written with.
serde = { workspace = true }
toml = { workspace = true }

# PipeWire is the Linux backend; Windows has its own (`src/wasapi/`), on WASAPI.
[target.'cfg(target_os = "linux")'.dependencies]
# `v0_3_64` on `pipewire` is the level the code needs: without it `keys::NODE_LINK_GROUP`,
# `keys::TARGET_OBJECT`, `keys::NODE_WANT_DRIVER` and `Buffer::requested()` do not exist
# (`docs/api/pipewire-0.10-rust.md` §1.1). Not `v0_3_65`, although 0.3.65 is the floor: that level
# turns on libspa's `v0_3_65`, whose `MediaSubtype::Opus` names `SPA_MEDIA_SUBTYPE_opus`, which
# PipeWire only added in 0.3.68 — so against the 0.3.65 headers of Debian bookworm, where the
# release tarball is built, libspa 0.10.1 does not compile. Nothing here uses what libspa gates
# behind its own levels, so `libspa` takes none beyond what `pipewire` turns on.
# Features are additive on top of the workspace pin, so the version stays workspace-owned.
pipewire = { workspace = true, features = ["v0_3_64"] }
libspa = { workspace = true }
# `pipewire` 0.10.1 wraps no `pw_context_load_module`, and the echo canceller is a module
# (`src/aec.rs`, `docs/0.4.0-design.md` §7). The same version `pipewire` itself links, so the
# pointers its safe types hand out are the pointers these bindings take.
pipewire-sys = { workspace = true }

# WASAPI is the Windows backend (`src/wasapi/`). The API families its files call, and no others:
# the MMDevice API, the audio clients and the endpoint volume (`Media_Audio`, `_Endpoints`); the
# endpoints' property stores and the keys read from them (`UI_Shell_PropertiesSystem`,
# `Com_StructuredStorage` and `Variant` for the values, `Devices_FunctionDiscovery` for the
# `PKEY_Device_*`); the threads' apartments and the policy object (`System_Com`); events, waits,
# MMCSS and the process path (`System_Threading`, with `Security` for `CreateEventW`'s signature);
# and the process list the original FxSound is found in (`Diagnostics_ToolHelp`).
# `windows-core` itself is for the `#[interface]` that declares `IPolicyConfig` and the
# `#[implement]` of the notification callbacks — the endpoints', the volume's, the sessions' —
# whose expansions name `::windows_core`.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = { workspace = true }

# The tests read JSON on Linux: `graph_churn`'s, to read the format one of our nodes holds out of
# `pw-dump`'s JSON rather than out of a status the engine is right not to send, and `routes`', to
# read the UCM laptop fixture's card routes, whose nested structs the device tests' minimal reader
# does not cover.
[target.'cfg(target_os = "linux")'.dev-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
# The tests' scratch directories and guarded children (`fxsound_core::test_support`).
fxsound-core = { workspace = true, features = ["test-support"] }
# The click tests (`src/graph_churn/clicks.rs`) switch between shipped presets as the app does,
# read by the crate the app reads them with.
fxsound-preset = { workspace = true }
# Their high-pass, as one product of spectra: the crate the DSP computes its spectrum with.
realfft = { workspace = true }
